<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selembly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#0c0d10;
  --bg2:#121419;
  --bg3:#171a20;
  --bg4:#1d2128;

  --border:#252932;
  --border2:#303540;

  --text:#eef2ff;
  --dim:#7d8596;

  --line:#ffffff;
  --accent:#7c8cff;

  --kw:#8ab4ff;
  --str:#96d39b;
  --num:#ffcb6b;
  --mem:#f29ec2;
  --arrow:#ff9e64;

  --sel:#7c8cff33;
}

html,
body{
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font:14px/1.7 "Space Mono",monospace;
}

body{
  display:flex;
  flex-direction:column;
}

.topbar{
  height:52px;
  background:rgba(18,20,25,.92);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  backdrop-filter:blur(18px);
}

.topbarTitle{
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;
  color:var(--text);
}

.topbarLeft{
  display:flex;
  align-items:center;
  gap:10px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:999px;
  background:#2b2f37;
}

.runBtn{
  height:34px;
  border:none;
  background:linear-gradient(180deg,#8b9bff,#6d7cff);
  color:#fff;
  padding:0 16px;
  border-radius:10px;
  font:12px "Space Mono",monospace;
  font-weight:700;
  cursor:pointer;
  transition:.16s ease;
  box-shadow:
    0 0 0 1px #ffffff10 inset,
    0 10px 30px #6d7cff22;
}

.runBtn:hover{
  transform:translateY(-1px);
  filter:brightness(1.05);
}

.mainWrap{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.editorWrap{
  flex:1;
  position:relative;
  display:flex;
  overflow:hidden;
  background:var(--bg2);
}

.lineNumbers{
  width:64px;
  padding:18px 14px 18px 0;
  text-align:right;
  border-right:1px solid var(--border);
  color:#565e70;
  background:var(--bg);
  user-select:none;
  overflow:hidden;
}

.lineNumbers span{
  display:block;
}

.lineNumbers .active{
  color:var(--line);
}

.hlLayer,
textarea{
  position:absolute;
  inset:0 0 0 64px;
  padding:18px 22px;
  overflow:auto;
  white-space:pre;
  tab-size:2;
  font:inherit;
  line-height:inherit;
}

.hlLayer{
  pointer-events:none;
}

.hlLayer div{
  min-height:1.7em;
}

.hlLayer .active{
  background:#ffffff05;
}

textarea{
  border:none;
  outline:none;
  resize:none;
  background:none;
  color:transparent;
  caret-color:#fff;
}

textarea::selection{
  background:var(--sel);
}

.resizeBar{
  height:8px;
  background:var(--bg);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  cursor:row-resize;
}

.outputWrap{
  height:190px;
  min-height:90px;
  background:var(--bg3);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.outputTop{
  height:42px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:var(--bg4);
}

.outputLabel{
  font-size:12px;
  color:var(--dim);
  letter-spacing:.04em;
}

.status{
  width:8px;
  height:8px;
  border-radius:999px;
  background:#7cff9b;
  box-shadow:0 0 14px #7cff9b88;
}

.output{
  flex:1;
  overflow:auto;
  padding:16px 18px;
  white-space:pre-wrap;
  word-break:break-word;
}

.outputLine{
  margin-bottom:5px;
}

.kw{color:var(--kw)}
.st{color:var(--str)}
.nm{color:var(--num)}
.mf{color:var(--mem)}
.ar{color:var(--arrow)}

::-webkit-scrollbar{
  width:10px;
  height:10px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:#2a2f38;
  border-radius:999px;
  border:2px solid transparent;
  background-clip:padding-box;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbarLeft">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="topbarTitle">Selembly</div>
  </div>

  <button class="runBtn" id="runBtn">Run</button>
</div>

<div class="mainWrap">

  <div class="editorWrap">
    <div class="lineNumbers" id="lineNumbers"></div>
    <div class="hlLayer" id="hlLayer"></div>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>

  <div class="resizeBar" id="resizeBar"></div>

  <div class="outputWrap" id="outputWrap">
    <div class="outputTop">
      <div class="outputLabel">Output</div>
      <div class="status"></div>
    </div>

    <div class="output" id="output"></div>
  </div>

</div>

<script>
const editor = document.getElementById('editor');
const hlLayer = document.getElementById('hlLayer');
const lineNumbers = document.getElementById('lineNumbers');
const output = document.getElementById('output');
const runBtn = document.getElementById('runBtn');
const resizeBar = document.getElementById('resizeBar');
const outputWrap = document.getElementById('outputWrap');

const cmds = new Set([
  'cd','ml','mr','sd','prD','prS',
  'rs','cld','ndt','cdk','sdk','prDK'
]);

function esc(s){
  return s
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function tokenize(line){
  if(!line) return '';

  let out = '';
  let i = 0;

  while(i < line.length){

    const space = line.slice(i).match(/^(\s+)/);

    if(space){
      out += esc(space[1]);
      i += space[1].length;
      continue;
    }

    if(line[i] === '"'){
      const close = line.indexOf('"',i + 1);

      if(close !== -1){
        out += `<span class="st">${esc(line.slice(i,close + 1))}</span>`;
        i = close + 1;
        continue;
      }
    }

    const arrows = line.slice(i).match(/^([<>]+)/);

    if(arrows){
      out += `<span class="ar">${esc(arrows[1])}</span>`;
      i += arrows[1].length;
      continue;
    }

    const mem = line.slice(i).match(/^(\[\d+\])/);

    if(mem){
      out += `<span class="mf">${esc(mem[1])}</span>`;
      i += mem[1].length;
      continue;
    }

    const token = line.slice(i).match(/^(\S+)/);

    if(token){

      const t = token[1];

      if(cmds.has(t)){
        out += `<span class="kw">${esc(t)}</span>`;
      }else if(/^-?\d+(\.\d+)?$/.test(t)){
        out += `<span class="nm">${esc(t)}</span>`;
      }else{
        out += esc(t);
      }

      i += t.length;
    }
  }

  return out;
}

let active = 0;

function syncScroll(){
  hlLayer.scrollTop = editor.scrollTop;
  hlLayer.scrollLeft = editor.scrollLeft;
  lineNumbers.scrollTop = editor.scrollTop;
}

function updateActive(){

  const line = (
    editor.value
      .slice(0,editor.selectionStart)
      .match(/\n/g) || []
  ).length;

  if(line === active) return;

  hlLayer.children[active]?.classList.remove('active');
  lineNumbers.children[active]?.classList.remove('active');

  hlLayer.children[line]?.classList.add('active');
  lineNumbers.children[line]?.classList.add('active');

  active = line;
}

function rebuild(){

  const lines = editor.value.split('\n');

  active = (
    editor.value
      .slice(0,editor.selectionStart)
      .match(/\n/g) || []
  ).length;

  hlLayer.innerHTML = lines.map((line,i)=>
    `<div${i===active?' class="active"':''}>${tokenize(line)}</div>`
  ).join('');

  lineNumbers.innerHTML = lines.map((_,i)=>
    `<span${i===active?' class="active"':''}>${i+1}</span>`
  ).join('');

  syncScroll();
}

editor.addEventListener('input',rebuild);
editor.addEventListener('scroll',syncScroll);
editor.addEventListener('click',updateActive);
editor.addEventListener('keyup',updateActive);

editor.addEventListener('keydown',e=>{

  if(e.key === 'Tab'){

    e.preventDefault();

    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const val = editor.value;

    editor.value =
      val.slice(0,start) +
      '  ' +
      val.slice(end);

    editor.selectionStart =
    editor.selectionEnd = start + 2;

    rebuild();
  }
});

function println(v){

  const div = document.createElement('div');

  div.className = 'outputLine';
  div.textContent = String(v);

  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

function runSelembly(code){

  output.innerHTML = '';

  const memory = {
    data:{
      selected:1,
      count:10,
      data:[]
    },
    tbls:{}
  };

  function smartvalue(v){
    return isNaN(Number(v)) ? v : Number(v);
  }

  function resolvevalue(v){

    if(v == null) return null;

    const ref = v.match(/^\[(\d+)\]$/);

    if(ref){
      return memory.data.data[Number(ref[1])];
    }

    return smartvalue(v);
  }

  function updatedata(){

    for(let i = 1; i <= memory.data.count; i++){

      if(memory.data.data[i] == null){
        memory.data.data[i] = 1;
      }
    }
  }

  updatedata();

  const lines = code.split('\n');

  for(const line of lines){

    const args = [];
    let i = 0;

    while(i < line.length){

      while(/\s/.test(line[i])) i++;

      if(i >= line.length) break;

      if(line[i] === '"'){

        let end = i + 1;

        while(end < line.length && line[end] !== '"'){
          end++;
        }

        args.push(line.slice(i + 1,end));
        i = end + 1;

      }else{

        let end = i;

        while(end < line.length && !/\s/.test(line[end])){
          end++;
        }

        args.push(line.slice(i,end));
        i = end;
      }
    }

    if(!args[0]) continue;

    if(args[0] === 'cd'){

      memory.data.count = Number(args[1]);
      updatedata();

    }else if(args[0] === 'ml'){

      memory.data.selected--;

      if(memory.data.selected < 1){
        memory.data.selected = memory.data.count;
      }

    }else if(args[0] === 'mr'){

      memory.data.selected++;

      if(memory.data.selected > memory.data.count){
        memory.data.selected = 1;
      }

    }else if(args[0] === 'sd'){

      const v = memory.data.selected;

      if(/^[<>]+$/.test(args[1] || '')){

        let net = 0;

        for(const c of args[1]){
          if(c === '>') net++;
          else net--;
        }

        memory.data.data[v] =
          (memory.data.data[v] || 1) + net;

      }else{

        memory.data.data[v] =
          resolvevalue(args[1]);
      }

    }else if(args[0] === 'prD'){

      println(memory.data.data[memory.data.selected]);

    }else if(args[0] === 'prS'){

      println(memory.data.selected);

    }else if(args[0] === 'rs'){

      memory.data.selected = 1;

    }else if(args[0] === 'cld'){

      for(let i = 1; i < memory.data.data.length; i++){
        memory.data.data[i] = 1;
      }

    }else if(args[0] === 'ndt'){

      if(args[1]){
        memory.tbls[args[1]] = {};
      }

    }else if(args[0] === 'cdk'){

      if(args[1] && args[2]){
        memory.tbls[args[1]][args[2]] = 1;
      }

    }else if(args[0] === 'sdk'){

      if(args[1] && args[2] && args[3]){
        memory.tbls[args[1]][args[2]] =
          resolvevalue(args[3]);
      }

    }else if(args[0] === 'prDK'){

      if(args[1] && args[2]){
        println(memory.tbls[args[1]][args[2]]);
      }
    }
  }
}

runBtn.addEventListener('click',()=>{
  runSelembly(editor.value);
});

let dragging = false;

resizeBar.addEventListener('mousedown',()=>{
  dragging = true;
  document.body.style.userSelect = 'none';
});

window.addEventListener('mouseup',()=>{
  dragging = false;
  document.body.style.userSelect = '';
});

window.addEventListener('mousemove',e=>{

  if(!dragging) return;

  const total = window.innerHeight - 52;

  let h = total - (e.clientY - 52);

  if(h < 90) h = 90;
  if(h > total - 140) h = total - 140;

  outputWrap.style.height = h + 'px';
});

editor.value =
`ndt scores

cdk scores player1
cdk scores player2

sdk scores player1 50
sdk scores player2 93

sd "Player 1 scores:"
mr
sd "Player 2 scores:"

ml
prD
prDK scores player1

mr
prD
prDK scores player2`;

rebuild();
editor.focus();
</script>

</body>
</html>
